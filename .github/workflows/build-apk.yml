name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Modern LG Remote APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for User
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/*.apk build-artifacts/Modern-LG-Remote.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modern-LG-Remote-APK
          path: build-artifacts/Modern-LG-Remote.apk

      - name: Publish to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Modern LG Remote v1.0.0 (Samsung Galaxy S26 Ultra Edition)"
          body: |
            ### 📺 Modern LG Remote – Companion für LG OLED G4 & Samsung Galaxy S26 Ultra ✨
            
            **Highlights dieser Version:**
            - 🚀 **< 15 ms Latenz**: Direkte lokale Root-Steuerung über Port 8080.
            - 🔘 **Samsung Quick-Settings-Kachel**: Bottom-Sheet-Overlay direkt über jeder App im Galaxy S26 Ultra.
            - 📱 **2x2 Startbildschirm-Widget**: 4 frei konfigurierbare Buttons (Power WoL, OLED Display Aus, PC HDMI 1, Mini-Remote).
            - 🔔 **Automatische Live-Notification & Sperrbildschirm**: Erscheint automatisch, sobald der LG OLED im Heim-WLAN läuft.
            - 🔊 **Physische Lautstärketasten**: Steuerung der TV-Lautstärke über die S26-Ultra-Tasten.
            - 🔈 **Denon AVR-1803 Audio-Output-Badge**: 1-Tap-Wechsel zwischen Denon (Optisch) und internen TV-Lautsprechern.
            - 🎮 **3-Wege-Pad**: Wischgesten mit S26-Ultra-Haptik, klassisches D-Pad und flüssiger Magic Cursor.
            - 📲 **Samsung Modi & Routinen**: Direkte Shortcuts für Automatisierungen & die Funktionstaste.
            
            **Installation auf dem S26 Ultra:**
            1. `Modern-LG-Remote.apk` unten anklicken und herunterladen.
            2. APK öffnen und installieren (bei Bedarf "Installation aus dieser Quelle zulassen").
            3. App öffnen – sie verbindet sich automatisch mit deinem LG OLED im Heim-WLAN!
          files: build-artifacts/Modern-LG-Remote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
