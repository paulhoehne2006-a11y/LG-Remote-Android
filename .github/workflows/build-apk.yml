name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes a running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests & lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/*.apk build-artifacts/LG-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LG-Remote-APK
          path: build-artifacts/LG-Remote.apk

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "LG Remote (aktueller Stand)"
          body: |
            Aktueller Build von `main` (${{ github.sha }}).

            **Installation:** `LG-Remote.apk` auf dem Handy herunterladen und öffnen
            (ggf. „Installation aus dieser Quelle zulassen“). Voraussetzung ist der
            Modern-LG-Hub (`server.py`, Port 8080) auf dem Fernseher.
          files: build-artifacts/LG-Remote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
